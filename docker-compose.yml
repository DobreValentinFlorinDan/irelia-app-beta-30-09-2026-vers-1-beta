services:
  irelia-fieldbook:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      RIOT_API_KEY: ${RIOT_API_KEY}
      LEAGUE_CLIENT_LOCKFILE: ${LEAGUE_CLIENT_LOCKFILE:-}
    volumes:
      - ./:/app
      - /app/node_modules
    stdin_open: true
    tty: true